<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIROS-SHOP</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;padding:14px}
h1{color:#facc15;text-align:center} .tabs{display:flex;gap:10px} .tabs button{flex:1;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px}
.act{background:#facc15} .noact{background:#334155;color:#fff}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:0;box-sizing:border-box}
.btn{background:#25D366;color:#fff;border:0;padding:13px;width:100%;border-radius:12px;font-weight:bold;font-size:16px}
.card{background:#1e293b;padding:14px;border-radius:16px;margin:12px 0}
.card img{width:100%;height:220px;object-fit:cover;border-radius:12px}
.card b{font-size:19px} .price{color:#facc15;font-size:22px;font-weight:bold}
.wa{display:block;text-align:center;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px}
.admin-card{background:#1e293b;padding:12px;border-radius:14px;margin:10px 0;display:flex;gap:10px;align-items:center}
.admin-card img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.del{background:#ef4444;color:#fff;border:0;padding:8px;border-radius:8px} .edit{background:#f59e0b;border:0;padding:8px;border-radius:8px}
</style></head><body>

<h1>⚡ KAIROS-SHOP</h1>
<div class="tabs">
<button id="btnTienda" class="act" onclick="ver('tienda')">🛒 TIENDA</button>
<button id="btnAdmin" class="noact" onclick="ver('admin')">⚙️ PANEL</button>
</div>

<!-- TIENDA -->
<div id="vistaTienda"></div>

<!-- PANEL -->
<div id="vistaAdmin" style="display:none">
<h3>➕ Agregar / Editar</h3>
<input id="nombre" placeholder="Nombre: Freidora 20 Litros">
<input id="precio" placeholder="Precio USD: 82" type="number">
<input id="desc" placeholder="Descripción">
<input id="foto" placeholder="Link de foto">
<input type="hidden" id="editId">
<button class="btn" onclick="guardar()">💾 GUARDAR - YA SALE EN TIENDA</button>
<button class="btn" style="background:#64748b;margin-top:8px" onclick="limpiar()">Limpiar</button>
<h3>📦 Tus Productos</h3>
<div id="listaAdmin"></div>
<div style="display:flex;gap:10px;margin-top:20px"><a href="https://github.com" style="flex:1;text-align:center;background:#24292f;color:#fff;padding:12px;border-radius:10px;text-decoration:none">🐙 GitHub</a><a href="https://dashboard.render.com" style="flex:1;text-align:center;background:#5b21b6;color:#fff;padding:12px;border-radius:10px;text-decoration:none">🚀 Render</a></div>
</div>

<script>
let productos = JSON.parse(localStorage.getItem('kairos_v2')||'[]');
if(productos.length==0){
 productos=[
  {id:1,nombre:'Freidora de Aire 20 Litros',precio:82,desc:'Sin aceite, fácil de limpiar',foto:'https://via.placeholder.com/400x300?text=Freidora'},
  {id:2,nombre:'Olla Arrocera RUDEN',precio:22,desc:'Negra o Blanca',foto:'https://via.placeholder.com/400x300?text=Arrocera'},
  {id:3,nombre:'Estufa 3 Quemadores',precio:22,desc:'Acero inoxidable',foto:'https://via.placeholder.com/400x300?text=Estufa'},
 ];
 guardar();
}
function guardar(){localStorage.setItem('kairos_v2',JSON.stringify(productos)); mostrar();}
function mostrar(){
 // TIENDA
 document.getElementById('vistaTienda').innerHTML = productos.map(p=>`
  <div class="card"><img src="${p.foto}"><br><b>${p.nombre}</b><br><span style="color:#94a3b8">${p.desc}</span><br><span class="price">$${p.precio} USD</span>
  <a class="wa" href="https://wa.me/15702171840?text=${encodeURIComponent('Hola Kairos, quiero: '+p.nombre+' $'+p.precio)}">📲 PEDIR POR WHATSAPP</a></div>`).join('') || '<p style="text-align:center">No hay productos todavía. Ve a PANEL y agrega uno.</p>';
 // ADMIN
 document.getElementById('listaAdmin').innerHTML = productos.map(p=>`
  <div class="admin-card"><img src="${p.foto}"><div style="flex:1"><b>${p.nombre}</b><br>$${p.precio} - ${p.desc}</div><button class="edit" onclick="editar(${p.id})">Editar</button><button class="del" onclick="borrar(${p.id})">X</button></div>`).join('');
}
function ver(v){
 document.getElementById('vistaTienda').style.display = v=='tienda'?'block':'none';
 document.getElementById('vistaAdmin').style.display = v=='admin'?'block':'none';
 document.getElementById('btnTienda').className = v=='tienda'?'act':'noact';
 document.getElementById('btnAdmin').className = v=='admin'?'act':'noact';
}
function guardarProd(){
 let n=document.getElementById('nombre').value, pr=document.getElementById('precio').value, d=document.getElementById('desc').value, f=document.getElementById('foto').value||'https://via.placeholder.com/400x300?text=Kairos';
 let id=document.getElementById('editId').value;
 if(!n||!pr){alert('Falta nombre y precio');return;}
 if(id){let p=productos.find(x=>x.id==id); p.nombre=n;p.precio=pr;p.desc=d;p.foto=f;}
 else{productos.push({id:Date.now(),nombre:n,precio:pr,desc:d,foto:f});}
 limpiar(); guardar(); alert('¡Listo! Ya salió en la TIENDA'); ver('tienda');
}
// para que el boton llame a guardarProd
document.querySelector('#vistaAdmin .btn').onclick = guardarProd;
function editar(id){let p=productos.find(x=>x.id==id); document.getElementById('nombre').value=p.nombre; document.getElementById('precio').value=p.precio; document.getElementById('desc').value=p.desc; document.getElementById('foto').value=p.foto; document.getElementById('editId').value=id; ver('admin'); window.scrollTo(0,0);}
function borrar(id){if(confirm('¿Borrar?')){productos=productos.filter(x=>x.id!=id); guardar();}}
function limpiar(){['nombre','precio','desc','foto','editId'].forEach(i=>document.getElementById(i).value='');}
mostrar();
</script>
</body></html>
